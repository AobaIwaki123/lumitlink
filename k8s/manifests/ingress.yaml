apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumipage
  labels:
    app.kubernetes.io/name: lumipage
    app.kubernetes.io/part-of: lumi-series
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: lumipage.aooba.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumipage
                port:
                  number: 8080
