apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lumitlink
  labels:
    app.kubernetes.io/name: lumitlink
    app.kubernetes.io/part-of: lumi-series
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: lumitlink.aooba.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lumitlink
                port:
                  number: 8080
